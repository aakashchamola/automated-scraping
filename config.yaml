# ──────────────────────────────────────────────────────────────────────────────
# Automated Biotech Job Scraping Pipeline — Configuration
#
# Entry points:
#   python automation_pipeline.py          → runs all 4 pipeline steps in order
#   python main.py                         → keyword scraping only
#   python job_validator.py                → job URL validation only
#   python company_enricher.py             → company data enrichment only
#
# Test tabs (safe to destroy): Jobs_Test, CompaniesTest, CompaniesTest2
# Production tabs (do not overwrite): Jobs, Company, People, Keywords
# ──────────────────────────────────────────────────────────────────────────────


# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: info       # debug | info | warning | error


# ── HTTP / Network ────────────────────────────────────────────────────────────
# Shared network settings used by all scrapers and the job validator.
http:
  timeout_seconds: 10                    # seconds before a request is aborted
  max_retries: 3                         # retry attempts on transient failures
  retry_delay_seconds: 1                 # seconds to wait between retries
  delay_between_requests_seconds: 0      # polite pause between consecutive requests (0 = off)


# ── Keyword Scraping ──────────────────────────────────────────────────────────
# Searches job boards (LinkedIn, Indeed, Glassdoor, etc.) for jobs matching
# each keyword. Results are written to jobs_worksheet + output_csv.
scraping:
  output_csv: jobs.csv                   # local CSV backup; Google Sheets is the primary sink
  keywords_fallback_file: keywords.txt   # used when keywords_source.mode = file
                                         # or when the Keywords sheet returns nothing

  # Where to load search keywords from.
  #   mode: sheet  → reads from the "Keywords" Google Sheet tab  (preferred)
  #   mode: file   → reads from keywords_fallback_file instead
  keywords_source:
    mode: sheet
    worksheet: Keywords                  # tab name in Google Sheets
    column: Search Term                  # column header within that tab

  # Active job-board platforms in scrape order.
  # Comment out any line to skip that platform.
  #
  # WORKING:
  #   linkedin    — public guest search API, reliable, 10 jobs/page
  #   indeed      — public search HTML, works from server IPs
  #   internshala — public search HTML, works well for research roles
  #   jobs.lever  — company-specific ATS API; requires lever.sites list below
  #
  # BLOCKED (Cloudflare / JS-rendered — do not enable from server IPs):
  #   glassdoor   — Cloudflare 403
  #   wellfound   — Cloudflare 403
  #   simplyhired — Cloudflare 403
  #   ycombinator — JS-rendered React SPA, no static job data
  platforms:
    - linkedin
    - indeed
    - internshala
    # - jobs.lever    # enable + add sites list under platform_settings.jobs.lever.sites
    # - glassdoor     # blocked from server IPs
    # - wellfound     # blocked from server IPs
    # - simplyhired   # blocked from server IPs
    # - ycombinator   # JS-rendered, no accessible job data

  # Per-platform tuning. Each key must match a platform name in the list above.
  platform_settings:
    linkedin:
      location: United States
      max_pages: 12           # each page = 10 jobs (see page_size); 12 pages = up to 120/keyword
      page_size: 10           # LinkedIn guest endpoint returns 10 jobs/fetch and treats
                              # `start` as a row offset — stepping by 10 avoids skipping jobs
      page_delay_seconds: 2.0 # pause between pages to avoid rate-limiting

    indeed:
      country: us
      location: United States
      max_pages: 1

    glassdoor:
      location: United States
      max_pages: 1
      loc_id: ""           # numeric Glassdoor location ID (leave blank for any location)

    jobs.lever:
      location: United States
      max_pages: 1
      sites: []            # list of Lever company slugs to target (empty = use keyword search)

    internshala:
      location: United States
      max_pages: 1

    wellfound:
      location: United States
      max_pages: 1

    ycombinator:
      location: United States
      max_pages: 1

    simplyhired:
      location: United States
      max_pages: 1


# ── Career-Page Scraping ──────────────────────────────────────────────────────
# Scrapes job postings directly from company career pages (not job boards).
# Career page URLs come from the "Career-Page" column in the Company sheet.
# Only jobs whose title contains at least one keyword are kept.
career_pages:
  source_worksheet: Company          # Sheet tab with manually-curated company data
  company_column: Company            # Column header for company name in that tab
  career_page_column: Career-Page    # Column header for career page URL (hyphen as-is in sheet)
  max_jobs_per_company: 50           # safety cap: max jobs collected per company per run

  # How much of a multi-word keyword must appear in a job title.
  #   all   every word — highest precision (default)
  #   most  more than half the words
  #   any   a single word is enough — highest recall, and the most noise
  # Job-board results are already keyword-filtered by the search itself, so
  # this only affects career-page scraping, where the company's whole posting
  # list comes back. A run over 325 companies with "all" kept 9 of thousands.
  keyword_match_mode: all


# ── Pagination / "See More Jobs" Analysis ─────────────────────────────────────
# Read-only diagnostic (Tasks #4 & #8). Walks LinkedIn's "See More Jobs" guest
# endpoint page by page per keyword to measure how many jobs lie beyond page 1
# and how deep the infinite scroll goes. Never writes to the Jobs sheet.
#   python pagination_analyzer.py --config config.yaml
pagination_analysis:
  platform: linkedin           # only linkedin is supported today
  location: United States
  page_size: 10                # jobs per "See More Jobs" fetch (LinkedIn returns 10)
  max_probe_pages: 50          # safety cap: 50 * 10 = up to 500 jobs probed per keyword
  page_delay_seconds: 1.5      # pause between page fetches (rate-limit politeness)
  keywords_limit: 0            # 0 = all keywords; >0 = first N only (quick tests)
  output_csv: logs/pagination_analysis_latest.csv
  write_to_sheet: false        # true → also write the report to output_worksheet
  output_worksheet: Pagination_Analysis   # TEST tab (created if missing)


# ── Job Validation ────────────────────────────────────────────────────────────
# Probes every "Job Link" in the jobs sheet and writes one of:
#   Active   — URL responds 2xx/3xx  (row stays white)
#   Expired  — posting is closed (LinkedIn "no longer accepting" banner or other 4xx)  (row → red)
#   Removed  — URL is gone (404 / 410)  (row → red)
#   Unknown  — network error or 5xx; will retry next run  (row → yellow)
job_validation:
  re_validate: false    # false → skip rows that already have a status (fast, saves API calls)
                        # true  → re-check every URL regardless of existing status

  # Row removal. Runs only AFTER validation, so it acts on statuses written
  # moments earlier. Every deleted row is written to logs/removed_rows_*.csv
  # first — a status is an HTTP probe's judgement, and a site that blocks a
  # datacenter IP looks exactly like a closed posting.
  remove_rows: false            # true → delete rows whose status is listed below
  remove_statuses:              # only used when remove_rows is true
    - Expired
    - Removed


# ── Organization Classification ───────────────────────────────────────────────
# Task #5: separate companies, universities, educational institutions, and other
# organizations. Rule-based (domain TLD + name + optional Industry column). Writes
# the verdict into output_column and color-codes the row.
#   python company_classifier.py --config config.yaml
#   python company_classifier.py --config config.yaml --dry-run
classification:
  source_worksheet: CompaniesTest    # TEST tab to classify (Company / Career Page / LinkedIn URL)
  name_column: Company
  career_page_column: Career Page    # used for .edu/.gov domain signal (optional)
  linkedin_url_column: LinkedIn URL  # fallback domain signal (optional)
  industry_column: Industry          # used only if the tab has this column (e.g. Company tab)
  output_column: Organization Type   # auto-created if missing
  write_to_sheet: true               # false (or --dry-run) → classify + log only
  color_rows: true                   # color each row by category


# ── Projects (control spreadsheet) ────────────────────────────────────────────
# One registry sheet lists every project; each project has its own spreadsheet
# with its own Jobs / Companies / Keywords / Settings tabs. Pick one with
# --project <id>; with no flag the first active project is used.
#
# Adding a project needs no commit here: create a sheet, share it with the
# service account as Editor, and add a row to the registry.
control:
  enabled: true
  spreadsheet_id: 1opBzNjpVU2RIkRPo_wgcPjgKx6-iZT_ZCrmICA7AjHY
  worksheet: Projects


# ── Google Sheets ─────────────────────────────────────────────────────────────
google_sheets:
  enabled: true
  credentials_file: secrets/google-service-account.json
  spreadsheet_id: 1SEIHZXpHu6dnjEJ3MHTdljOPhOnLY-2eRzi5vXIYrmA

  # The tab where scraped jobs land.
  # ⚠ Switch between Jobs_Test (testing) and Jobs (production) here.
  jobs_worksheet: Jobs_Test


  # ── Company Data (manually curated) ─────────────────────────────────────────
  # The "Company" tab is the hand-maintained source of truth for company metadata.
  # It is NOT written to by automation — only read from.
  company_sheet:
    worksheet: Company
    company_column: Company
    employee_count_column: Avg. Employee-Count  # exact header in the Company tab
    career_page_column: Career-Page             # hyphenated to match actual sheet header
    linkedin_url_column: Linkedin-Url           # hyphenated to match actual sheet header
    job_link_column: Job Link

    # What this sheet is used for during pipeline runs:
    sync_companies_to_enrichment: true      # copy new company names from Jobs → enrichment sheet
    use_for_linkedin_hyperlinks: true       # hyperlink company names in Jobs to their LinkedIn page
    use_for_career_page_fallback: true      # fall back to this sheet when a career page URL is missing


  # ── Enrichment Output ────────────────────────────────────────────────────────
  # company_enricher.py writes scraped data (employee count, career page, LinkedIn URL)
  # into this worksheet. This is automation-written — safe to reset for testing.
  enrichment_output_worksheet: CompaniesTest

  # Column headers in the enrichment output worksheet (must match the actual sheet headers exactly).
  enrichment_output_columns:
    company: Company
    employee_count: Employee Count
    career_page: Career Page
    linkedin_url: LinkedIn URL


  # ── Enrichment Controls ──────────────────────────────────────────────────────
  # Controls when the enricher should re-scrape cells that already contain a value.
  enrichment_controls:
    retry_na_fields: false               # true → re-scrape cells whose current value is "N/A"
    retry_invalid_career_values:         # re-scrape career page cells that match any of these strings
      - "://"
