# Publishes the dashboard, and can run the pipeline here as a fallback.
#
# THE AUTOMATION NO LONGER NEEDS THIS. Runs happen on whichever machine has
# agent.py going, started from the dashboard's Run buttons, and the weekly
# cadence is a time-driven trigger in apps-script/Settings.gs — both queued
# through the project's own sheet. The cron that used to live here was removed
# when that landed, or every scheduled run would happen twice.
#
# What is left:
#   publish  deploys the static page to GitHub Pages on push. No secrets, no
#            Python, no data — the dashboard reads the sheet through the Web
#            App now, so there is nothing to export.
#   run      the old pipeline, on demand only. Kept because it is the one path
#            that works when no machine is available, and because it is the
#            owner's fallback if the agent is not running. It needs the
#            service-account key; nothing else here does.
#
# ONE-TIME SETUP for `run` — add the Google service-account key as a secret:
#   gh secret set GOOGLE_SERVICE_ACCOUNT < secrets/google-service-account.json
#
# Why some platforms are dropped below: measured from a runner on 2026-08-29
# (probe-datacenter-ip.yml). From a datacenter IP, LinkedIn's guest API and the
# Greenhouse/Workday ATS APIs answer normally, but Indeed returns a Cloudflare
# 403 and Internshala serves a challenge page with a 200 status. Leaving them
# enabled would spend the whole run collecting nothing and log misleading
# "0 jobs found" lines, so CI runs without them. Nothing is changed for a local
# run, where both still work — which is the better reason to run it there.
name: Publish the dashboard

on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/scheduled-pipeline.yml'
  workflow_dispatch:
    inputs:
      project:
        description: Project id from the control sheet (blank = the first active one)
        type: string
        required: false
        default: ''
      steps:
        description: Which part of the pipeline to run
        type: choice
        default: full
        options:
          - publish-only          # touch nothing; just refresh the dashboard
          - full                  # enrich -> career pages -> job boards -> validate
          - scrape-only           # job boards only
          - career-pages-only     # company career pages only
          - enrich-only           # fill employee count / career page / LinkedIn URL
          - validate-only         # re-check every job link
          - mismatch-only         # flag cells where scraped data disagrees
          - classify-only         # company / university / government / ...
          - pagination-only       # read-only "See More Jobs" depth report
          - cleanup-rows          # clear stale company rows (dry-run unless confirmed)

concurrency:
  # Every step writes the same tabs, so runs against ONE project must queue —
  # but two projects are two different spreadsheets and need not wait.
  group: pipeline-${{ inputs.project || 'default' }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    # Dispatch only. Pressing Run on the dashboard queues the work for the
    # machine running agent.py instead; this is the fallback for when there
    # isn't one.
    if: github.event_name == 'workflow_dispatch' && inputs.steps != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Read by every tool through projects_registry; blank = first active.
      PROJECT_ID: ${{ inputs.project }}
      # This run log is readable by any signed-in GitHub user while the
      # repository is public, and the pipeline logs the rows it reads. Keep the
      # console to warnings; the log FILE still gets everything. See
      # logger_setup.console_level.
      LOG_CONSOLE_LEVEL: warning
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Restore the service-account key
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT secret is not set. Add it with:"
            echo "::error::  gh secret set GOOGLE_SERVICE_ACCOUNT < secrets/google-service-account.json"
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$KEY" > secrets/google-service-account.json
          python -c "import json;json.load(open('secrets/google-service-account.json'))" \
            || { echo "::error::the secret is not valid JSON"; exit 1; }

      - name: Which project this run works on
        # Every tool reads PROJECT_ID from the environment (see
        # projects_registry.add_project_argument), so nothing below needs a
        # flag. Blank means the first active project in the control sheet.
        run: |
          python -u - <<'PY'
          import os
          import projects_registry
          from config_loader import load_config

          config = load_config("config.yaml")
          registry = projects_registry.registry_from_config(config)
          active = registry.list()
          if not active:
              raise SystemExit("::error::the control sheet lists no active projects")

          wanted = (os.environ.get("PROJECT_ID") or "").strip()
          if wanted:
              project = registry.get(wanted)
              if not project:
                  # The count, never the names — this log is readable by any
                  # signed-in GitHub user while the repository is public.
                  raise SystemExit(
                      f"::error::no project {wanted!r} in the control sheet "
                      f"({len(active)} active project(s) exist)")
          else:
              project = active[0]
              print("::notice::no project given; using the first active one")

          # Register the identifiers as masks so that ANY later line which
          # happens to contain them — from this workflow or from a module deep
          # in the pipeline — is printed as *** instead. Defence in depth: the
          # console is already raised to WARNING in CI, but a stray print or a
          # library warning would not respect that.
          for secret in (project["id"], project.get("name", ""),
                         project["spreadsheet_id"]):
              if secret and len(secret) > 3:
                  print(f"::add-mask::{secret}")

          print("resolved 1 project from the control sheet")
          PY

      - name: Apply the Settings worksheet
        # The published dashboard cannot write settings, so the Settings tab in
        # the spreadsheet is where they are edited. Overlaying it here means a
        # change made in the sheet takes effect on the next run with no commit.
        run: python -u settings_sheet.py --config config.yaml --apply-to config.yaml

      - name: Configure this run
        run: |
          python - <<'PY'
          import os
          from ruamel.yaml import YAML

          yaml = YAML(); yaml.preserve_quotes = True
          yaml.indent(mapping=2, sequence=4, offset=2)
          cfg = yaml.load(open("config.yaml"))

          # Drop the platforms that a datacenter IP cannot reach (see header).
          blocked = {"indeed", "internshala"}
          keep = [p for p in cfg["scraping"]["platforms"] if p not in blocked]
          dropped = sorted(set(cfg["scraping"]["platforms"]) - set(keep))
          cfg["scraping"]["platforms"] = keep

          yaml.dump(cfg, open("config.yaml", "w"))
          print("platforms this run :", keep)
          print("dropped (blocked)  :", dropped or "none")
          print("writes to sheet    :", cfg["google_sheets"]["enabled"])
          PY

      - name: Run
        if: inputs.steps != 'publish-only'
        run: |
          case "${{ inputs.steps || 'full' }}" in
            scrape-only)        python -u main.py --config config.yaml ;;
            validate-only)      python -u job_validator.py --config config.yaml ;;
            enrich-only)        python -u company_enricher.py --config config.yaml ;;
            mismatch-only)      python -u company_validator.py --config config.yaml ;;
            classify-only)      python -u company_classifier.py --config config.yaml ;;
            pagination-only)    python -u pagination_analyzer.py --config config.yaml ;;
            cleanup-rows)       python -u cleanup_validation.py \
                                  --config cleanup_validation_config.json ;;
            career-pages-only)  python -u automation_pipeline.py --config config.yaml \
                                  --skip-enrichment --skip-keyword-scraping --skip-validation ;;
            *)                  python -u automation_pipeline.py --config config.yaml ;;
          esac

      - name: Keep the logs
        # PRIVATE REPOSITORIES ONLY. The log file records what the pipeline
        # reads — company names, career page URLs, search keywords — which is
        # exactly the sheet content the published dashboard encrypts. On a
        # public repository an artifact is downloadable by any signed-in GitHub
        # user, so uploading it would hand that content out for free. Measured,
        # not assumed: a non-collaborator account downloaded and read this
        # artifact. The file still exists on the runner for the life of the job,
        # and a local run keeps full logs either way.
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Remove the key from the runner
        if: always()
        run: rm -f secrets/google-service-account.json

  # ── Publish the dashboard ──────────────────────────────────────────────────
  # Exports the sheet tabs to JSON, encrypts them under DASHBOARD_PASSWORD, and
  # deploys the static page. The service-account key exists only inside this
  # job; the only thing that reaches Pages is ciphertext, so a public URL never
  # exposes the sheet or the key.
  publish:
    # `needs: run` for ORDER only, never as a requirement — hence always() and
    # the explicit 'skipped'. It used to be a hard dependency, so the page was
    # redeployed only after a pipeline run. That was fine while a cron
    # guaranteed one every week; now that runs happen on somebody's machine, a
    # change to the dashboard would never have reached anyone.
    needs: [run]
    if: always() && (needs.run.result == 'success' || needs.run.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No Python, no service-account key, and no data export. The dashboard
      # reads each tab from the Web App as it is opened, so there is nothing to
      # snapshot — which also means this job handles no secret but the /exec URL
      # that is baked into a world-readable config.js anyway.

      - name: Refuse to publish cleartext
        # A snapshot is no longer exported, but old ones may still be committed,
        # and a readable copy of a sheet must never reach a public URL.
        #
        # It reports COUNTS, never paths: a directory under site/data is named
        # for its project, and this log is readable by any signed-in GitHub user
        # while the repository is public. Listing them would publish the project
        # names the design takes care never to disclose.
        run: |
          if [ -d site/data ] && find site/data -name '*.json' ! -name '*.enc.json' | grep -q .; then
            echo "::error::cleartext JSON found under site/data — refusing to publish"
            find site/data -name '*.json' ! -name '*.enc.json' -printf '%f\n' | sort -u
            exit 1
          fi
          files=$([ -d site/data ] && find site/data -name '*.enc.json' | wc -l || echo 0)
          echo "$files encrypted snapshot file(s) carried over, all ciphertext"

      - name: Stamp the build
        run: |
          # Nothing project-specific goes in here. config.js is served from a
          # world-readable URL, and a project id is derived from its name, so
          # stamping one would disclose exactly what the design hides.
          cat > site/config.js <<JS
          window.DASHBOARD_CONFIG = {
            repo: "${{ github.repository }}",
            workflow: "scheduled-pipeline.yml",
            branch: "${{ github.ref_name }}",
            builtAt: "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            settingsWebApp: "${{ secrets.SETTINGS_WEB_APP_URL }}",
          };
          JS
          if [ -z "${{ secrets.SETTINGS_WEB_APP_URL }}" ]; then
            echo "::notice::SETTINGS_WEB_APP_URL is not set — Settings and Keywords will be read-only and projects cannot be created."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
